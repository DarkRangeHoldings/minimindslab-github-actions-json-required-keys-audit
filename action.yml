name: "Required JSON Keys"
description: "Fail a workflow when a JSON object is missing any required top-level keys."
inputs:
  payload:
    description: "JSON payload consumed by the action"
    required: true
outputs:
  result:
    description: "Compact JSON result produced by the action"
runs:
  using: "node24"
  main: "index.js"
branding:
  icon: "check-circle"
  color: "blue"
